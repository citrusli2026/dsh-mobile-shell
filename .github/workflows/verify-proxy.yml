name: verify-proxy

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['proxy/**', 'scripts/**', '.github/workflows/verify-proxy.yml']
  pull_request:
    paths: ['proxy/**', 'scripts/**', '.github/workflows/verify-proxy.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dsh engines: node ^22.19 || >=24
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the published dsh CLI
        run: npm install -g @deepseek-ai/dsh

      - name: Start dsh web (loopback)
        run: |
          dsh web --port 3080 > dsh.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3080/ && exit 0
            sleep 1
          done
          echo "dsh web did not become ready"; cat dsh.log; exit 1

      - name: Start dsh-remote and run the smoke matrix
        run: |
          DSH_REMOTE_TOKEN=ci-test-token-123456 node proxy/dsh-remote.mjs > proxy.log 2>&1 &
          sleep 1
          DSH_REMOTE_TOKEN=ci-test-token-123456 node scripts/verify-proxy.mjs

      - name: Run the TLS variant of the matrix (self-signed test cert)
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout tls-key.pem -out tls-cert.pem \
            -days 1 -nodes -subj "/CN=dsh-remote-ci"
          DSH_REMOTE_TOKEN=ci-test-token-123456 DSH_LISTEN_PORT=3082 \
            DSH_TLS_CERT=$PWD/tls-cert.pem DSH_TLS_KEY=$PWD/tls-key.pem \
            node proxy/dsh-remote.mjs > proxy-tls.log 2>&1 &
          sleep 1
          PROXY_URL=https://127.0.0.1:3082 DSH_VERIFY_INSECURE_TLS=1 \
            DSH_REMOTE_TOKEN=ci-test-token-123456 node scripts/verify-proxy.mjs

      # ADR-0007: with the launcher disabled the proxy keeps its plain 401 face.
      - name: Launcher-off variant (DSH_LAUNCHER=off)
        run: |
          DSH_REMOTE_TOKEN=ci-test-token-123456 DSH_LISTEN_PORT=3083 DSH_LAUNCHER=off \
            node proxy/dsh-remote.mjs > proxy-nolauncher.log 2>&1 &
          sleep 1
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3083/)
          [ "$code" = "401" ] || { echo "GET / expected 401, got $code"; cat proxy-nolauncher.log; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3083/launch)
          [ "$code" = "404" ] || { echo "GET /launch expected 404, got $code"; exit 1; }
