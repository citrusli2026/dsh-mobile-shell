<!doctype html>
<!-- dsh-remote launcher -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http: https:; base-uri 'none'; form-action 'self'" />
<title>DSH — 连接主机</title>
<style>
  /* ── Design Tokens ── */
  :root {
    --bg: #ffffff;
    --bg-secondary: #f7f7f8;
    --surface: #ffffff;
    --border: #e5e5e8;
    --border-strong: #d1d1d6;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #a1a1a6;
    --accent: #3667f6;
    --accent-hover: #2851e3;
    --accent-dim: rgba(54, 103, 246, 0.08);
    --ok: #10b981;
    --ok-dim: rgba(16, 185, 129, 0.08);
    --err: #ef4444;
    --err-dim: rgba(239, 68, 68, 0.08);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.02);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.04);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --ease-reveal: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ── Reset & Base ── */
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    font: 16px/1.6 "Inter", -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
    overflow-x: hidden;
    position: relative;
  }

  /* ── Subtle background texture ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(54, 103, 246, 0.035), transparent),
      radial-gradient(ellipse 40% 40% at 80% 100%, rgba(54, 103, 246, 0.02), transparent);
    pointer-events: none;
    z-index: 0;
  }

  main {
    width: 100%; max-width: 420px;
    position: relative; z-index: 1;
  }

  /* ── Brand Header ── */
  .brand {
    text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(12px);
    animation: reveal 0.6s var(--ease-reveal) 0.05s forwards;
    position: relative;
  }
  .brand__logo {
    width: 48px; height: 48px;
    margin: 0 auto 20px;
    background: var(--accent);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
    letter-spacing: -0.02em;
    box-shadow: var(--shadow-md);
  }
  .brand__title {
    font-size: 28px; font-weight: 700;
    letter-spacing: -0.03em; line-height: 1.2;
    color: var(--text);
  }
  .brand__sub {
    color: var(--text-secondary);
    font-size: 15px; margin-top: 8px;
    line-height: 1.5;
    font-weight: 400;
  }
  .lang {
    position: absolute; top: -8px; right: -8px;
    padding: 4px 10px;
    font: inherit; font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .lang:hover { border-color: var(--border-strong); color: var(--text); }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    opacity: 0;
    transform: translateY(16px);
    animation: reveal 0.6s var(--ease-reveal) 0.15s forwards;
    box-shadow: var(--shadow-lg);
  }

  /* ── Saved Connection ── */
  .saved__host {
    font-weight: 600; font-size: 15px;
    word-break: break-all; color: var(--text);
    letter-spacing: -0.01em;
  }
  .saved__meta {
    color: var(--text-tertiary);
    font-size: 13px; margin: 6px 0 24px;
    display: flex; align-items: center; gap: 6px;
  }
  .saved__meta::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--ok);
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--ok-dim);
  }
  .saved__meta.expired { color: var(--err); }
  .saved__meta.expired::before {
    background: var(--err);
    box-shadow: 0 0 0 2px var(--err-dim);
  }
  .saved__actions {
    display: flex; gap: 10px; margin-top: 10px;
  }
  .saved__actions .btn { margin-top: 0; }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 4px;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 4px;
    margin-bottom: 24px;
    position: relative;
  }
  .tabs__track {
    position: absolute;
    top: 4px; bottom: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius-md) - 2px);
    box-shadow: var(--shadow-sm);
    transition: transform 0.3s var(--ease-spring), width 0.3s var(--ease-spring);
    z-index: 0;
  }
  .tabs button {
    flex: 1; position: relative; z-index: 1;
    margin: 0; padding: 10px 8px;
    font-size: 14px; font-weight: 500;
    background: transparent; color: var(--text-secondary);
    border: none; border-radius: var(--radius-sm);
    cursor: pointer;
    transition: color 0.2s ease;
    -webkit-appearance: none; appearance: none;
  }
  .tabs button.active { color: var(--text); }

  /* ── Form Elements ── */
  label {
    display: block;
    color: var(--text-secondary);
    font-size: 13px; font-weight: 500;
    margin: 20px 0 8px;
    letter-spacing: 0.01em;
  }
  input {
    width: 100%; padding: 12px 14px;
    border-radius: var(--radius-md);
    font: inherit; font-size: 15px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    -webkit-appearance: none; appearance: none;
  }
  input::placeholder { color: var(--text-tertiary); }
  input:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  input#code {
    font-size: 26px; font-weight: 600;
    letter-spacing: 0.3em; text-align: center;
    font-variant-numeric: tabular-nums;
    padding: 16px 14px 16px calc(14px + 0.15em);
  }
  input#code::placeholder {
    font-size: 20px; letter-spacing: 0.25em;
    font-weight: 400; color: var(--text-tertiary);
  }

  /* ── Buttons ── */
  .btn {
    width: 100%; margin-top: 24px; padding: 13px;
    border: none; border-radius: var(--radius-md);
    font: inherit;
    font-size: 15px; font-weight: 600; line-height: 1.5;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    position: relative; overflow: hidden;
    transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled {
    opacity: 0.45; cursor: not-allowed;
    transform: none;
  }
  .btn--primary {
    background: var(--accent);
    color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .btn--primary:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 4px 16px rgba(54, 103, 246, 0.25);
  }
  .btn--ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    margin-top: 10px;
    box-shadow: none;
  }
  .btn--ghost:hover:not(:disabled) {
    border-color: var(--border-strong);
    color: var(--text);
    background: var(--bg-secondary);
  }
  :is(button, input):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── Hints & Status ── */
  .hint {
    color: var(--text-tertiary);
    font-size: 13px; line-height: 1.55;
    margin-top: 10px;
  }
  .status {
    margin-top: 16px; font-size: 14px; min-height: 22px;
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .status.visible { opacity: 1; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status__dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status.ok .status__dot { background: var(--ok); }
  .status.err .status__dot { background: var(--err); }

  /* ── Web Host Line ── */
  .web-host {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--ok-dim);
    border: 1px solid rgba(16, 185, 129, 0.12);
    border-radius: var(--radius-md);
    color: #059669;
    font-size: 13px; font-weight: 500;
    margin-bottom: 4px;
    opacity: 0;
    animation: reveal 0.5s var(--ease-reveal) 0.35s forwards;
  }
  .web-host svg { flex-shrink: 0; }

  /* ── Hidden utility ── */
  .hidden { display: none !important; }

  /* Web mode: hide server fields */
  body.web .server-field { display: none; }

  /* ── Keyframes ── */
  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Loading spinner ── */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn:disabled .spinner { display: block; }
  .btn:disabled .btn__text { opacity: 0.7; }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Narrow screens (roadmap W4: 320 px) ── */
  @media (max-width: 360px) {
    body { padding-left: 12px; padding-right: 12px; }
    .card { padding: 20px 16px; }
    .brand__title { font-size: 24px; }
    input#code { font-size: 22px; }
    .saved__actions { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="brand__logo">DSH</div>
    <h1 class="brand__title">DSH 连接器</h1>
    <p class="brand__sub" data-i18n="brandSub">连接你的 DeepSeek Harness 主机</p>
    <button id="langBtn" class="lang" type="button" data-testid="lang-toggle" aria-label="切换语言 / Switch language">EN</button>
  </div>

  <section id="savedCard" class="card hidden" data-testid="saved-card">
    <div class="saved__host" id="savedHost" data-testid="saved-host"></div>
    <div class="saved__meta" id="savedMeta" data-i18n="savedMeta">已保存的主机</div>
    <button id="continueBtn" class="btn btn--primary" data-testid="continue-btn">
      <span class="spinner"></span>
      <span class="btn__text" data-i18n="continue">继续连接</span>
    </button>
    <div class="saved__actions">
      <button id="logoutBtn" class="btn btn--ghost" type="button" data-testid="logout-btn" data-i18n="logout">退出当前设备</button>
      <button id="forgetBtn" class="btn btn--ghost" type="button" data-testid="forget-btn" data-i18n="forget">忘记此主机</button>
    </div>
    <button id="changeBtn" class="btn btn--ghost" data-testid="change-btn" data-i18n="changeHost">更换主机</button>
  </section>

  <div id="picker" class="card" data-testid="picker">
    <div class="tabs" role="tablist">
      <div class="tabs__track" id="tabTrack"></div>
      <button id="tabPair" class="active" type="button" role="tab" aria-selected="true" aria-controls="pairForm" data-testid="tab-pair" data-i18n="tabPair">配对码连接</button>
      <button id="tabToken" type="button" role="tab" aria-selected="false" aria-controls="tokenForm" data-testid="tab-token" data-i18n="tabToken">令牌连接</button>
    </div>

    <form id="pairForm">
      <div id="webHostLine" class="web-host hidden" data-testid="web-host-line">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span id="webHostText" data-testid="web-host-text"></span>
      </div>
      <label for="pairServer" class="server-field" data-i18n="hostAddress">主机地址</label>
      <input id="pairServer" class="server-field" inputmode="url" autocapitalize="off" autocorrect="off"
             placeholder="例如 192.168.1.10:3081" data-testid="pair-server" />
      <label for="code" data-i18n="pairCode">配对码</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
             placeholder="000000" data-testid="pair-code" aria-describedby="pairHint" />
      <p class="hint" id="pairHint" data-i18n="pairHint">主机启动 dsh-remote 时会打印一个 6 位配对码（单次使用、10 分钟有效）</p>
      <button id="pairBtn" type="submit" class="btn btn--primary" data-testid="pair-btn">
        <span class="spinner"></span>
        <span class="btn__text" data-i18n="pairAndConnect">配对并连接</span>
      </button>
    </form>

    <form id="tokenForm" class="hidden">
      <label for="server" class="server-field" data-i18n="hostAddress2">主机地址</label>
      <input id="server" class="server-field" inputmode="url" autocapitalize="off" autocorrect="off"
             placeholder="例如 192.168.1.10:3081" data-testid="server" />
      <label for="token" data-i18n="tokenLabel">访问令牌（token）</label>
      <input id="token" type="password" autocapitalize="off" autocorrect="off"
             placeholder="dsh-remote 代理上配置的令牌" data-testid="token" />
      <button id="connectBtn" type="submit" class="btn btn--primary" data-testid="connect-btn">
        <span class="spinner"></span>
        <span class="btn__text" data-i18n="connect">连接</span>
      </button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite" data-testid="status">
      <span class="status__dot" aria-hidden="true"></span>
      <span id="statusText" data-testid="status-text"></span>
    </p>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id)
const STORE_KEY = 'dsh.connection'
const LANG_KEY = 'dsh.lang'
const FRAGMENT = new URLSearchParams(location.hash.slice(1))
const QR_PAIR_CODE = FRAGMENT.get('pair')
const APP_SESSION_TOKEN = FRAGMENT.get('dsh-session')
const CLEAN_QUERY = new URLSearchParams(location.search)
CLEAN_QUERY.delete('token')
const CLEAN_SEARCH = CLEAN_QUERY.toString()
  ? '?' + CLEAN_QUERY.toString()
  : ''
if (QR_PAIR_CODE !== null || APP_SESSION_TOKEN !== null || location.search !== CLEAN_SEARCH) {
  history.replaceState(null, '', location.pathname + CLEAN_SEARCH)
}

/* ── i18n (roadmap W4): zh default, browser-negotiated, manual toggle ── */
const I18N = {
  zh: {
    brandSub: '连接你的 DeepSeek Harness 主机',
    savedMeta: '已保存的主机',
    savedExpired: '会话已过期，请重新配对',
    continue: '继续连接',
    logout: '退出当前设备',
    forget: '忘记此主机',
    changeHost: '更换主机',
    tabPair: '配对码连接',
    tabToken: '令牌连接',
    hostAddress: '主机地址',
    hostAddress2: '主机地址',
    pairCode: '配对码',
    pairHint: '主机启动 dsh-remote 时会打印一个 6 位配对码（单次使用、10 分钟有效）',
    pairAndConnect: '配对并连接',
    tokenLabel: '访问令牌（token）',
    connect: '连接',
    currentHost: '当前主机：',
    title: 'DSH — 连接主机',
    needHost: '请填写主机地址',
    badHost: '主机地址无效',
    confirmLabel: '确认配对并连接',
    qrPrefilled: '已从二维码填入配对码，请确认连接',
    qrInvalid: '二维码中的配对码无效，请重新扫描',
    establishing: '正在建立安全会话…',
    sessionDead: '设备会话已失效，请重新配对',
    connected: '已连接，正在进入…',
    paired: '已配对，正在进入…',
    checkingHost: '正在检查主机…',
    redeeming: '正在兑换配对码…',
    hostTimeout: '连不上主机：超时，请确认主机与手机在同一局域网',
    badToken: '访问令牌无效',
    tooMany: '尝试过多，请稍后再试',
    badCode: '配对码无效或已过期',
    badResponse: '主机响应异常',
    needCode: '配对码是 6 位数字',
    needToken: '请填写访问令牌',
    upstreamDown: '代理在线，但上游 dsh web 未运行；请先在主机上启动 dsh web',
    loggedOut: '已退出当前设备，请重新配对',
    forgot: '已忘记此主机，请重新配对',
  },
  en: {
    brandSub: 'Connect to your DeepSeek Harness host',
    savedMeta: 'Saved host',
    savedExpired: 'Session expired — pair again',
    continue: 'Continue',
    logout: 'Sign out this device',
    forget: 'Forget this host',
    changeHost: 'Change host',
    tabPair: 'Pairing code',
    tabToken: 'Access token',
    hostAddress: 'Host address',
    hostAddress2: 'Host address',
    pairCode: 'Pairing code',
    pairHint: 'Starting dsh-remote on the host prints a 6-digit code (single use, 10 minutes)',
    pairAndConnect: 'Pair & connect',
    tokenLabel: 'Access token',
    connect: 'Connect',
    currentHost: 'Current host: ',
    title: 'DSH — Connect to host',
    needHost: 'Enter the host address',
    badHost: 'Invalid host address',
    confirmLabel: 'Confirm pairing & connect',
    qrPrefilled: 'Pairing code filled from QR — confirm to connect',
    qrInvalid: 'Invalid pairing code in QR — scan again',
    establishing: 'Establishing secure session…',
    sessionDead: 'Device session expired — pair again',
    connected: 'Connected, entering…',
    paired: 'Paired, entering…',
    checkingHost: 'Checking host…',
    redeeming: 'Redeeming pairing code…',
    hostTimeout: 'Cannot reach the host: timed out. Check that phone and computer share the LAN',
    badToken: 'Invalid access token',
    tooMany: 'Too many attempts — try again later',
    badCode: 'Pairing code invalid or expired',
    badResponse: 'Unexpected host response',
    needCode: 'The pairing code is 6 digits',
    needToken: 'Enter the access token',
    upstreamDown: 'Proxy is up, but upstream dsh web is not running; start dsh web on the host first',
    loggedOut: 'Signed out — pair again',
    forgot: 'Host forgotten — pair again',
  },
}
let LANG = 'zh'
try {
  const stored = typeof localStorage !== 'undefined' ? localStorage.getItem(LANG_KEY) : null
  const browser = typeof navigator !== 'undefined' && navigator.language ? navigator.language.toLowerCase() : ''
  LANG = stored === 'en' || stored === 'zh'
    ? stored
    : (browser.startsWith('zh') ? 'zh' : stored ? 'en' : 'zh')
  if (!stored && browser && !browser.startsWith('zh')) LANG = 'en'
} catch { LANG = 'zh' }
const t = (key) => (I18N[LANG] ?? I18N.zh)[key] ?? I18N.zh[key] ?? key

function applyLanguage() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en'
  document.title = t('title')
  for (const el of document.querySelectorAll('[data-i18n]')) {
    el.textContent = t(el.getAttribute('data-i18n'))
  }
  $('pairServer').placeholder = LANG === 'zh' ? '例如 192.168.1.10:3081' : 'e.g. 192.168.1.10:3081'
  $('server').placeholder = $('pairServer').placeholder
  $('token').placeholder = LANG === 'zh' ? 'dsh-remote 代理上配置的令牌' : 'the token configured on dsh-remote'
  const langBtn = $('langBtn')
  if (langBtn) langBtn.textContent = LANG === 'zh' ? 'EN' : '中文'
}
$('langBtn').onclick = () => {
  LANG = LANG === 'zh' ? 'en' : 'zh'
  try { localStorage.setItem(LANG_KEY, LANG) } catch {}
  applyLanguage()
  updateTabTrack()
  say(lastStatusKind, lastStatusTextKey ? t(lastStatusTextKey) : '')
}

/* ── Carrier detection ── */
const IS_APP = typeof window.Capacitor !== 'undefined'
if (!IS_APP) {
  document.body.classList.add('web')
  $('pairServer').value = location.origin + '/'
  $('server').value = location.origin + '/'
  $('webHostLine').classList.remove('hidden')
  $('webHostText').textContent = t('currentHost') + location.host
}

/* ── Tab track animation ── */
const tabTrack = $('tabTrack')
const tabPair = $('tabPair')
const tabToken = $('tabToken')
function updateTabTrack() {
  const active = document.querySelector('.tabs button.active')
  if (!active || !tabTrack) return
  const parent = active.parentElement
  const parentRect = parent.getBoundingClientRect()
  const rect = active.getBoundingClientRect()
  tabTrack.style.transform = `translateX(${rect.left - parentRect.left - 4}px)`
  tabTrack.style.width = `${rect.width}px`
}

function normalize(input) {
  const raw = (input || '').trim()
  if (!raw) throw new Error(t('needHost'))
  const hasScheme = /^https?:\/\//i.test(raw)
  const s = hasScheme ? raw : 'http://' + raw
  const url = new URL(s)
  if (!url.hostname) throw new Error(t('badHost'))
  if (!hasScheme && !url.port) url.port = '3081'
  url.pathname = '/'
  url.search = ''
  url.hash = ''
  return url
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null') } catch { return null }
}
function save(base, token) {
  const connection = { base, at: Date.now() }
  if (IS_APP && token) connection.token = token
  localStorage.setItem(STORE_KEY, JSON.stringify(connection))
}
function forget() {
  localStorage.removeItem(STORE_KEY)
}

async function healthcheck(base) {
  const ctl = new AbortController()
  const timer = setTimeout(() => ctl.abort(), 8000)
  try {
    const res = await fetch(base + 'healthz', { signal: ctl.signal, cache: 'no-store' })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const body = await res.json()
    if (body && body.upstream === false) throw new Error('upstream-down')
  } finally { clearTimeout(timer) }
}

function setBusy(busy) {
  for (const id of ['connectBtn', 'pairBtn', 'continueBtn']) {
    const btn = $(id)
    if (btn) btn.disabled = busy
  }
}
let lastStatusKind = ''
let lastStatusTextKey = ''
function say(kind, textOrKey) {
  lastStatusKind = kind
  lastStatusTextKey = I18N[LANG] && I18N[LANG][textOrKey] ? textOrKey : ''
  const el = $('status')
  const txt = $('statusText')
  el.className = 'status' + (kind ? ' ' + kind : '') + (textOrKey ? ' visible' : '')
  txt.textContent = lastStatusTextKey ? t(lastStatusTextKey) : textOrKey
}
function fail(e) {
  const msg = e && e.name === 'AbortError'
    ? t('hostTimeout')
    : e && e.message === 'upstream-down'
      ? t('upstreamDown')
      : String(e.message || e)
  say('err', msg)
}

function showPicker(message) {
  $('savedCard').classList.add('hidden')
  $('picker').classList.remove('hidden')
  if (message) say('err', message)
  requestAnimationFrame(() => {
    updateTabTrack()
    $(IS_APP ? 'pairServer' : 'code').focus()
  })
}

async function endDeviceSession() {
  try {
    await fetch((IS_APP && typeof saved !== 'undefined' && saved ? saved.base : '') + 'device/logout', { method: 'POST' })
  } catch {}
}

function enterWithAppToken(base, token) {
  save(base, token)
  say('ok', 'connected')
  location.assign(base + '#dsh-session=' + encodeURIComponent(token))
}

async function establishWebSession(base, token) {
  const res = await fetch(base + 'session', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ token }),
  })
  if (!res.ok) throw new Error(t('badToken'))
  save(base)
  say('ok', 'connected')
  location.assign(base)
}

async function connectWithToken(base, token) {
  say('', 'checkingHost'); setBusy(true)
  try {
    await healthcheck(base)
    if (IS_APP) enterWithAppToken(base, token)
    else await establishWebSession(base, token)
  } catch (e) { fail(e) } finally { setBusy(false) }
}

async function connectWithCode(base, code) {
  say('', 'redeeming'); setBusy(true)
  try {
    await healthcheck(base)
    const ctl = new AbortController()
    const timer = setTimeout(() => ctl.abort(), 10000)
    let res
    try {
      res = await fetch(base + 'pair', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          ...(IS_APP ? { 'x-dsh-client': 'app' } : {}),
        },
        body: JSON.stringify({ code }),
        signal: ctl.signal,
      })
    } finally { clearTimeout(timer) }
    if (res.status === 429) throw new Error(t('tooMany'))
    if (!res.ok) throw new Error(t('badCode'))
    const data = await res.json()
    if (IS_APP) {
      if (!data.token) throw new Error(t('badResponse'))
      enterWithAppToken(base, data.token)
    } else {
      save(base)
      say('ok', 'paired')
      location.assign(base)
    }
  } catch (e) { fail(e) } finally { setBusy(false) }
}

/* ── Saved connection ── */
const saved = load()
if (saved && saved.base && QR_PAIR_CODE === null && APP_SESSION_TOKEN === null) {
  $('savedCard').classList.remove('hidden')
  $('picker').classList.add('hidden')
  $('savedHost').textContent = saved.base
  $('server').value = saved.base
  $('pairServer').value = saved.base
  $('token').value = saved.token || ''
  $('continueBtn').onclick = () => {
    if (IS_APP) connectWithToken(saved.base, $('token').value || saved.token)
    else location.assign(saved.base)
  }
  $('changeBtn').onclick = () => {
    $('savedCard').classList.add('hidden')
    $('picker').classList.remove('hidden')
    requestAnimationFrame(() => {
      updateTabTrack()
      $('server').focus()
    })
  }
  /* Device lifecycle (roadmap W2): sign out revokes this device server-side;
   * forgetting also drops the saved host. Both land on a clean pairing page. */
  $('logoutBtn').onclick = async () => {
    setBusy(true)
    await endDeviceSession()
    setBusy(false)
    forget()
    showPicker('loggedOut')
  }
  $('forgetBtn').onclick = async () => {
    setBusy(true)
    await endDeviceSession()
    setBusy(false)
    forget()
    showPicker('forgot')
  }
  /* Web mode: detect an expired device session up front so "continue" never
   * bounces the user into a bare 401 (roadmap W3 error differentiation). */
  if (!IS_APP) {
    fetch('session/check', { cache: 'no-store' }).then(async (res) => {
      if (res.ok) return
      const meta = $('savedMeta')
      meta.textContent = t('savedExpired')
      meta.classList.add('expired')
      $('continueBtn').classList.add('hidden')
    }).catch(() => {})
  }
}

/* ── QR prefill ── */
function applyPairPrefill(rawCode) {
  $('savedCard').classList.add('hidden')
  $('picker').classList.remove('hidden')
  if (/^\d{6}$/.test(rawCode)) {
    $('code').value = rawCode
    const btn = $('pairBtn')
    const label = btn.querySelector('.btn__text')
    label.textContent = t('confirmLabel')
    // Keep the confirmation label from being reset by applyLanguage().
    if (typeof label.removeAttribute === 'function') label.removeAttribute('data-i18n')
    say('ok', 'qrPrefilled')
    requestAnimationFrame(() => btn.focus())
  } else {
    say('err', 'qrInvalid')
  }
}
if (QR_PAIR_CODE !== null) applyPairPrefill(QR_PAIR_CODE)
/* Re-scanning a fresh QR while the launcher is already open only changes the
 * hash — no reload — so react to hashchange as well. */
window.addEventListener('hashchange', () => {
  const code = new URLSearchParams(location.hash.slice(1)).get('pair')
  if (code === null) return
  history.replaceState(null, '', location.pathname + CLEAN_SEARCH)
  applyPairPrefill(code)
})

/* ── App session handoff ── */
if (APP_SESSION_TOKEN) {
  say('', 'establishing')
  fetch(location.origin + '/session', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ token: APP_SESSION_TOKEN }),
  }).then((res) => {
    if (!res.ok) throw new Error(t('sessionDead'))
    location.replace(location.origin + '/')
  }).catch(fail)
}

/* ── Mode tabs ── */
tabPair.onclick = () => {
  tabPair.classList.add('active'); tabToken.classList.remove('active')
  tabPair.setAttribute('aria-selected', 'true'); tabToken.setAttribute('aria-selected', 'false')
  $('pairForm').classList.remove('hidden'); $('tokenForm').classList.add('hidden')
  updateTabTrack()
  $(IS_APP ? 'pairServer' : 'code').focus()
}
tabToken.onclick = () => {
  tabToken.classList.add('active'); tabPair.classList.remove('active')
  tabToken.setAttribute('aria-selected', 'true'); tabPair.setAttribute('aria-selected', 'false')
  $('tokenForm').classList.remove('hidden'); $('pairForm').classList.add('hidden')
  updateTabTrack()
  $(IS_APP ? 'server' : 'token').focus()
}

/* ── Forms ── */
$('pairForm').onsubmit = (e) => {
  e.preventDefault()
  let url
  try { url = normalize(IS_APP ? $('pairServer').value : location.origin) } catch (err) { say('err', err.message); return }
  const code = $('code').value.trim()
  if (!/^\d{6}$/.test(code)) { say('err', 'needCode'); return }
  connectWithCode(url.origin + '/', code)
}
$('tokenForm').onsubmit = (e) => {
  e.preventDefault()
  let url
  try { url = normalize(IS_APP ? $('server').value : location.origin) } catch (err) { say('err', err.message); return }
  const token = $('token').value.trim()
  if (!token) { say('err', 'needToken'); return }
  connectWithToken(url.origin + '/', token)
}

/* ── Auto-focus & tab track init ── */
window.addEventListener('DOMContentLoaded', () => {
  applyLanguage()
  if (!IS_APP) $('webHostText').textContent = t('currentHost') + location.host
  updateTabTrack()
  if (QR_PAIR_CODE === null && $('savedCard').classList.contains('hidden')) {
    const pairMode = !$('pairForm').classList.contains('hidden')
    const firstInput = $(IS_APP
      ? (pairMode ? 'pairServer' : 'server')
      : (pairMode ? 'code' : 'token'))
    if (firstInput) firstInput.focus()
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => requestAnimationFrame(updateTabTrack))
  }
})

/* ── Resize observer for tab track ── */
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(updateTabTrack).observe(document.querySelector('.tabs'))
}
</script>
</body>
</html>
