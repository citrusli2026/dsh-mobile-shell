<!doctype html>
<!-- dsh-remote launcher -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http: https:; base-uri 'none'; form-action 'self'" />
<title>DSH — 连接主机</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #2d333b; --text: #e6edf3;
    --muted: #8b949e; --accent: #4c8dff; --ok: #3fb950; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100dvh;
    font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { width: 100%; max-width: 400px; }
  h1 { font-size: 28px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tabs button {
    flex: 1; margin: 0; padding: 9px; font-size: 14px; font-weight: 500;
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
  }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
  .tabs button:first-child { border-radius: 10px 0 0 10px; }
  .tabs button:last-child { border-radius: 0 10px 10px 0; }
  label { display: block; color: var(--muted); font-size: 13px; margin: 18px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; font: inherit;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input#code { font-size: 22px; letter-spacing: .35em; text-align: center; }
  button {
    width: 100%; margin-top: 26px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: 600 16px/1 inherit; cursor: pointer;
  }
  button:disabled { opacity: .55; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-top: 12px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .status { margin-top: 16px; font-size: 14px; min-height: 22px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .saved { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 8px; }
  .saved .host { font-weight: 600; word-break: break-all; }
  .saved .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hidden { display: none; }
  /* Web 模式（浏览器直开 dsh-remote）：主机就是当前源，地址输入不显示 */
  body.web .server-field { display: none; }
</style>
</head>
<body>
<main>
  <h1>DSH<span>·移动版</span></h1>
  <p class="sub">连接你的 DeepSeek Harness 主机（dsh web），功能与桌面版一致。</p>

  <section id="savedCard" class="saved hidden">
    <div class="host" id="savedHost"></div>
    <div class="meta">已保存的主机</div>
    <button id="continueBtn">继续连接</button>
    <button id="changeBtn" class="ghost">更换主机</button>
  </section>

  <div id="picker">
    <div class="tabs">
      <button id="tabPair" class="active" type="button">配对码连接</button>
      <button id="tabToken" type="button">令牌连接</button>
    </div>

    <form id="pairForm">
      <p class="hint hidden" id="webHostLine"></p>
      <label for="pairServer" class="server-field">主机地址</label>
      <input id="pairServer" class="server-field" inputmode="url" autocapitalize="off" autocorrect="off"
             placeholder="例如 192.168.1.10:3081" />
      <label for="code">配对码</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
             placeholder="· · · · · ·" />
      <p class="hint">主机启动 dsh-remote 时会打印一个 6 位配对码（单次使用、10 分钟有效）。</p>
      <button id="pairBtn" type="submit">配对并连接</button>
    </form>

    <form id="tokenForm" class="hidden">
      <label for="server" class="server-field">主机地址</label>
      <input id="server" class="server-field" inputmode="url" autocapitalize="off" autocorrect="off"
             placeholder="例如 192.168.1.10:3081" />
      <label for="token">访问令牌（token）</label>
      <input id="token" type="password" autocapitalize="off" autocorrect="off"
             placeholder="dsh-remote 代理上配置的令牌" />
      <button id="connectBtn" type="submit">连接</button>
    </form>
  </div>

  <p id="status" class="status" role="status"></p>
</main>

<script>
const $ = (id) => document.getElementById(id)
const STORE_KEY = 'dsh.connection'
const FRAGMENT = new URLSearchParams(location.hash.slice(1))
const QR_PAIR_CODE = FRAGMENT.get('pair')
const APP_SESSION_TOKEN = FRAGMENT.get('dsh-session')
const CLEAN_QUERY = new URLSearchParams(location.search)
CLEAN_QUERY.delete('token')
const CLEAN_SEARCH = CLEAN_QUERY.toString()
  ? '?' + CLEAN_QUERY.toString()
  : ''
if (QR_PAIR_CODE !== null || APP_SESSION_TOKEN !== null || location.search !== CLEAN_SEARCH) {
  // Pairing/session fragments and legacy token queries are never sent to the
  // server and are removed immediately so they do not remain in history or
  // copied URLs.
  history.replaceState(null, '', location.pathname + CLEAN_SEARCH)
}

// 载体识别（ADR-0007）：Capacitor 会注入 window.Capacitor；纯浏览器打开
// dsh-remote 时没有它，此时主机就是当前源，地址框隐藏，只需填配对码/令牌。
const IS_APP = typeof window.Capacitor !== 'undefined'
if (!IS_APP) {
  document.body.classList.add('web')
  $('pairServer').value = location.origin + '/'
  $('server').value = location.origin + '/'
  $('webHostLine').classList.remove('hidden')
  $('webHostLine').textContent = '当前主机：' + location.host
}

function normalize(input) {
  const raw = (input || '').trim()
  if (!raw) throw new Error('请填写主机地址')
  const hasScheme = /^https?:\/\//i.test(raw)
  const s = hasScheme ? raw : 'http://' + raw
  const url = new URL(s)
  if (!url.hostname) throw new Error('主机地址无效')
  // Bare LAN hosts keep the convenient proxy default. An explicit scheme
  // keeps its standard port (http:80 / https:443) instead of being rewritten.
  if (!hasScheme && !url.port) url.port = '3081'
  url.pathname = '/'
  url.search = ''
  url.hash = ''
  return url
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null') } catch { return null }
}
function save(base, token) {
  const connection = { base, at: Date.now() }
  // Browsers keep only an HttpOnly cookie. The bundled App may retain a scoped
  // device token at its private launcher origin for one-tap reconnect.
  if (IS_APP && token) connection.token = token
  localStorage.setItem(STORE_KEY, JSON.stringify(connection))
}

async function healthcheck(base) {
  const ctl = new AbortController()
  const timer = setTimeout(() => ctl.abort(), 8000)
  try {
    const res = await fetch(base + 'healthz', { signal: ctl.signal, cache: 'no-store' })
    if (!res.ok) throw new Error('HTTP ' + res.status)
  } finally { clearTimeout(timer) }
}

function setBusy(busy) {
  for (const id of ['connectBtn', 'pairBtn', 'continueBtn']) $(id).disabled = busy
}
function say(kind, text) {
  const el = $('status')
  el.className = 'status' + (kind ? ' ' + kind : '')
  el.textContent = text
}
function fail(e) {
  say('err', e && e.name === 'AbortError' ? '连不上主机：超时，请确认主机与手机在同一局域网' : String(e.message || e))
}

function enterWithAppToken(base, token) {
  save(base, token)
  say('ok', '已连接，正在进入…')
  // The fragment never reaches HTTP access logs. The remote launcher consumes
  // it through POST /session, clears it, then enters the authenticated UI.
  location.assign(base + '#dsh-session=' + encodeURIComponent(token))
}

async function establishWebSession(base, token) {
  const res = await fetch(base + 'session', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ token }),
  })
  if (!res.ok) throw new Error('访问令牌无效')
  save(base)
  say('ok', '已连接，正在进入…')
  location.assign(base)
}

async function connectWithToken(base, token) {
  say('', '正在检查主机…'); setBusy(true)
  try {
    await healthcheck(base)
    if (IS_APP) enterWithAppToken(base, token)
    else await establishWebSession(base, token)
  } catch (e) { fail(e) } finally { setBusy(false) }
}

async function connectWithCode(base, code) {
  say('', '正在兑换配对码…'); setBusy(true)
  try {
    await healthcheck(base)
    const ctl = new AbortController()
    const timer = setTimeout(() => ctl.abort(), 10000)
    let res
    try {
      res = await fetch(base + 'pair', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          ...(IS_APP ? { 'x-dsh-client': 'app' } : {}),
        },
        body: JSON.stringify({ code }),
        signal: ctl.signal,
      })
    } finally { clearTimeout(timer) }
    if (res.status === 429) throw new Error('尝试过多，请稍后再试')
    if (!res.ok) throw new Error('配对码无效或已过期')
    const data = await res.json()
    if (IS_APP) {
      if (!data.token) throw new Error('主机响应异常')
      enterWithAppToken(base, data.token)
    } else {
      save(base)
      say('ok', '已配对，正在进入…')
      location.assign(base)
    }
  } catch (e) { fail(e) } finally { setBusy(false) }
}

// ── saved connection ─────────────────────────────────────────────────────
const saved = load()
if (saved && saved.base && QR_PAIR_CODE === null && APP_SESSION_TOKEN === null) {
  $('savedCard').classList.remove('hidden')
  $('picker').classList.add('hidden')
  $('savedHost').textContent = saved.base
  $('server').value = saved.base
  $('pairServer').value = saved.base
  $('token').value = saved.token || ''
  $('continueBtn').onclick = () => {
    if (IS_APP) connectWithToken(saved.base, $('token').value || saved.token)
    else location.assign(saved.base)
  }
  $('changeBtn').onclick = () => {
    $('savedCard').classList.add('hidden')
    $('picker').classList.remove('hidden')
    $('server').focus()
  }
}

// QR links carry only the short-lived single-use pairing code. Prefill it but
// require one explicit confirmation so link previewers cannot consume a code.
if (QR_PAIR_CODE !== null) {
  $('savedCard').classList.add('hidden')
  $('picker').classList.remove('hidden')
  if (/^\d{6}$/.test(QR_PAIR_CODE)) {
    $('code').value = QR_PAIR_CODE
    $('pairBtn').textContent = '确认配对并连接'
    say('ok', '已从二维码填入配对码，请确认连接')
    $('pairBtn').focus()
  } else {
    say('err', '二维码中的配对码无效，请重新扫描')
  }
}

// App-to-remote session handoff. The device token is carried only in a URL
// fragment, immediately removed, and exchanged for an HttpOnly cookie.
if (APP_SESSION_TOKEN) {
  say('', '正在建立安全会话…')
  fetch(location.origin + '/session', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ token: APP_SESSION_TOKEN }),
  }).then((res) => {
    if (!res.ok) throw new Error('设备会话已失效，请重新配对')
    location.replace(location.origin + '/')
  }).catch(fail)
}

// ── mode tabs ────────────────────────────────────────────────────────────
$('tabPair').onclick = () => {
  $('tabPair').classList.add('active'); $('tabToken').classList.remove('active')
  $('pairForm').classList.remove('hidden'); $('tokenForm').classList.add('hidden')
  $('pairServer').focus()
}
$('tabToken').onclick = () => {
  $('tabToken').classList.add('active'); $('tabPair').classList.remove('active')
  $('tokenForm').classList.remove('hidden'); $('pairForm').classList.add('hidden')
  $('server').focus()
}

// ── forms ────────────────────────────────────────────────────────────────
$('pairForm').onsubmit = (e) => {
  e.preventDefault()
  let url
  try { url = normalize(IS_APP ? $('pairServer').value : location.origin) } catch (err) { say('err', err.message); return }
  const code = $('code').value.trim()
  if (!/^\d{6}$/.test(code)) { say('err', '配对码是 6 位数字'); return }
  connectWithCode(url.origin + '/', code)
}
$('tokenForm').onsubmit = (e) => {
  e.preventDefault()
  let url
  try { url = normalize(IS_APP ? $('server').value : location.origin) } catch (err) { say('err', err.message); return }
  const token = $('token').value.trim()
  if (!token) { say('err', '请填写访问令牌'); return }
  connectWithToken(url.origin + '/', token)
}
</script>
</body>
</html>
