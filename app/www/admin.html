<!doctype html>
<!-- dsh-remote admin console (roadmap W3) -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" />
<title>DSH — 设备管理</title>
<style>
  :root {
    --bg: #ffffff; --bg-secondary: #f7f7f8; --border: #e5e5e8; --border-strong: #d1d1d6;
    --text: #1a1a1a; --text-secondary: #6b6b6b; --text-tertiary: #a1a1a6;
    --accent: #3667f6; --accent-dim: rgba(54,103,246,0.08);
    --ok: #10b981; --err: #ef4444; --err-dim: rgba(239,68,68,0.08);
    --radius-md: 12px; --radius-lg: 16px;
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 22px; letter-spacing: -0.02em; margin-bottom: 4px; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-lg);
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
  input[type="password"] {
    width: 100%; padding: 11px 14px; font: inherit; font-size: 15px;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg-secondary); outline: none; -webkit-appearance: none; appearance: none;
  }
  input[type="password"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  button {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text);
    border-radius: var(--radius-md); padding: 9px 14px;
    -webkit-appearance: none; appearance: none;
  }
  button:hover { border-color: var(--border-strong); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); border-color: var(--err); background: var(--err-dim); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  :is(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 500; white-space: nowrap; }
  td.id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-tertiary); word-break: break-all; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .pill.ok { color: var(--ok); background: rgba(16,185,129,0.1); }
  .pill.dead { color: var(--err); background: var(--err-dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #status { margin-top: 12px; font-size: 13px; min-height: 20px; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  .hidden { display: none !important; }
  #qrBox svg { width: 200px; height: 200px; }
  .hint { color: var(--text-tertiary); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>DSH 设备管理</h1>
  <p class="sub">查看、吊销已配对设备，并签发新的配对二维码。主令牌只保留在本页内存中，不会被存储。</p>

  <section id="loginCard" class="card">
    <form id="loginForm">
      <label for="masterToken">主令牌（DSH_REMOTE_TOKEN）</label>
      <input id="masterToken" type="password" autocomplete="off" data-testid="admin-token" required />
      <div class="row" style="margin-top: 12px">
        <button class="primary" type="submit" data-testid="admin-unlock">解锁管理</button>
      </div>
      <p class="hint">需要主机上 dsh-remote 配置的 DSH_REMOTE_TOKEN；忘记令牌请在主机终端查看代理启动命令。</p>
    </form>
  </section>

  <section id="panel" class="hidden">
    <section class="card">
      <div class="row" style="margin-bottom: 12px">
        <button id="refreshBtn" type="button" data-testid="admin-refresh">刷新设备列表</button>
        <button id="newCodeBtn" type="button" data-testid="admin-new-code">签发新配对码</button>
        <button id="qrBtn" type="button" data-testid="admin-qr">下载 SVG 二维码</button>
      </div>
      <div id="qrBox" class="hidden" data-testid="admin-qr-box"></div>
      <p class="hint" id="pairLink"></p>
    </section>

    <section class="card">
      <table data-testid="admin-device-table">
        <thead>
          <tr><th>设备</th><th>状态</th><th>签发 / 最后使用</th><th>到期</th><th></th></tr>
        </thead>
        <tbody id="deviceRows"></tbody>
      </table>
      <p class="hint">吊销立即生效；旋转 DSH_REMOTE_TOKEN 会一次性吊销全部设备。删除主机上的设备登记文件（DSH_STATE_FILE）也可吊销全部设备。</p>
    </section>

    <div class="row">
      <button id="logoutBtn" type="button">退出本机管理</button>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite" data-testid="admin-status"></p>
</main>

<script>
const $ = (id) => document.getElementById(id)
let masterToken = ''

function say(kind, text) {
  const el = $('status')
  el.className = kind || ''
  el.textContent = text
}

function fmt(ts) {
  if (!ts) return '—'
  return new Date(ts).toLocaleString()
}

function authHeaders() {
  return { authorization: 'Bearer ' + masterToken }
}

async function loadDevices() {
  const res = await fetch('devices', { headers: authHeaders(), cache: 'no-store' })
  if (res.status === 401) throw new Error('主令牌无效')
  if (!res.ok) throw new Error('HTTP ' + res.status)
  const body = await res.json()
  const rows = $('deviceRows')
  rows.textContent = ''
  for (const device of body.devices) {
    const tr = document.createElement('tr')
    const name = document.createElement('td')
    name.textContent = device.name
    const state = document.createElement('td')
    const pill = document.createElement('span')
    pill.className = 'pill ' + (device.active ? 'ok' : 'dead')
    pill.textContent = device.active ? '在线' : (device.revokedAt ? '已吊销' : '已过期')
    state.appendChild(pill)
    const times = document.createElement('td')
    times.textContent = fmt(device.issuedAt) + ' / ' + fmt(device.lastSeenAt)
    const expires = document.createElement('td')
    expires.textContent = fmt(device.expiresAt)
    const action = document.createElement('td')
    if (device.active) {
      const btn = document.createElement('button')
      btn.className = 'danger'
      btn.textContent = '吊销'
      btn.setAttribute('data-testid', 'admin-revoke')
      btn.setAttribute('data-device-id', device.id)
      btn.onclick = () => revokeDevice(device.id, device.name)
      action.appendChild(btn)
    }
    tr.append(name, state, times, expires, action)
    rows.appendChild(tr)
  }
}

async function revokeDevice(id, name) {
  if (!confirm('吊销设备「' + name + '」？该设备将立即失去访问。')) return
  const res = await fetch('devices/revoke', {
    method: 'POST',
    headers: { ...authHeaders(), 'content-type': 'application/json' },
    body: JSON.stringify({ id }),
  })
  if (!res.ok) throw new Error('HTTP ' + res.status)
  say('ok', '已吊销 ' + name)
  await loadDevices()
}

async function mintCode() {
  const res = await fetch('pair/new', { method: 'POST', headers: authHeaders() })
  if (res.status === 401) throw new Error('主令牌无效')
  if (!res.ok) throw new Error('HTTP ' + res.status)
  const body = await res.json()
  say('ok', '新配对码 ' + body.code + '（10 分钟内单次有效），终端同步打印')
  const link = body.pairingUrls && body.pairingUrls[0]
  const linkEl = $('pairLink')
  linkEl.textContent = link ? '配对链接：' + link : ''
}

async function downloadQr() {
  const res = await fetch('pair/qr.svg', { headers: authHeaders(), cache: 'no-store' })
  if (res.status === 401) throw new Error('主令牌无效')
  if (!res.ok) throw new Error('HTTP ' + res.status)
  const svg = await res.text()
  const box = $('qrBox')
  box.classList.remove('hidden')
  box.innerHTML = svg
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }))
  const a = document.createElement('a')
  a.href = url
  a.download = 'dsh-pairing-qr.svg'
  a.click()
  setTimeout(() => URL.revokeObjectURL(url), 5000)
  say('ok', '已生成新配对二维码（同一次签发，10 分钟内单次有效）')
}

async function guarded(fn) {
  try { await fn() } catch (error) { say('err', String(error.message || error)) }
}

$('loginForm').onsubmit = async (e) => {
  e.preventDefault()
  masterToken = $('masterToken').value.trim()
  if (!masterToken) { say('err', '请填写主令牌'); return }
  await guarded(async () => {
    await loadDevices()
    $('loginCard').classList.add('hidden')
    $('panel').classList.remove('hidden')
    say('ok', '已解锁')
  })
}
$('refreshBtn').onclick = () => guarded(loadDevices)
$('newCodeBtn').onclick = () => guarded(mintCode)
$('qrBtn').onclick = () => guarded(downloadQr)
$('logoutBtn').onclick = () => {
  masterToken = ''
  $('masterToken').value = ''
  $('panel').classList.add('hidden')
  $('loginCard').classList.remove('hidden')
  say('', '')
}
</script>
</body>
</html>
