// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        // China mirrors first for local builds (see docs/02-build-and-dependencies.md);
        // skipped on GitHub runners, where direct google()/mavenCentral() is faster
        // and the Aliyun endpoints are flaky (502s observed in CI).
        if (System.getenv('GITHUB_ACTIONS') != 'true') {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // China mirrors first; upstream repos stay as fallback.
        if (System.getenv('GITHUB_ACTIONS') != 'true') {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
        }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
